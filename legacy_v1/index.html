<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StyleSense AI | Personalized Fashion</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    
    <main class="app-container">
        <header class="app-header">
            <h1>StyleSense AI</h1>
            <p>Your Personal AI Stylist</p>
        </header>

        <section class="input-section glass-panel">
            <form id="style-form">
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <div class="select-wrapper">
                        <select id="gender" name="gender" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="occasion">Occasion</label>
                    <div class="select-wrapper">
                        <select id="occasion" name="occasion" required>
                            <option value="" disabled selected>Select Occasion</option>
                            <option value="casual">Casual / Day Out</option>
                            <option value="office">Office / Professional</option>
                            <option value="party">Party / Evening</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="body-shape">Body Shape</label>
                    <div class="select-wrapper">
                        <select id="body-shape" name="body-shape" required>
                            <option value="" disabled selected>Select Shape</option>
                            <option value="hourglass">Hourglass</option>
                            <option value="pear">Pear</option>
                            <option value="apple">Apple</option>
                            <option value="rectangle">Rectangle</option>
                            <option value="invited-triangle">Inverted Triangle</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="climate">Climate</label>
                    <div class="select-wrapper">
                        <select id="climate" name="climate" required>
                            <option value="" disabled selected>Select Climate</option>
                            <option value="sunny">Sunny / Warm</option>
                            <option value="cold">Cold / Winter</option>
                            <option value="rainy">Rainy / Overcast</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="cta-button">Curate My Look</button>
            </form>
        </section>

        <section id="result-section" class="result-section glass-panel hidden">
            <div class="result-content">
                <h2>Your Personalized Look</h2>
                <div class="outfit-display">
                    <div class="image-container">
                        <img id="outfit-image" src="" alt="Recommended Outfit">
                    </div>
                    <div class="outfit-details">
                        <p id="outfit-description"></p>
                    </div>
                </div>
                <button id="reset-btn" class="secondary-button">Start Over</button>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
